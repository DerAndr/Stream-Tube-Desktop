name: macOS Intel build

on:
  push:
    branches: [macos-intel]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: |
          bundle=$(bash packaging/macos/build-app.sh)
          lipo -archs "$bundle/Contents/MacOS/streamtube"
          test "$(lipo -archs "$bundle/Contents/MacOS/streamtube")" = x86_64
          version=$(cargo metadata --format-version 1 --no-deps --locked | plutil -extract packages.0.version raw -o - -)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "dist/StreamTube-$version-macos-x86_64-UNOFFICIAL.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/*-macos-x86_64-UNOFFICIAL.zip
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="intel-v${VERSION}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/*-macos-x86_64-UNOFFICIAL.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Stream Tube ${VERSION} — macOS Intel (unofficial)" \
            --notes "Unofficial x86_64 build for Intel Macs. Requires: brew install mpv. Not notarised: right-click → Open on first launch."
