name: macOS Intel build

on:
  push:
    branches: [macos-intel]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "assets/**", "packaging/macos/**", ".github/workflows/macos-intel.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-intel

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Homebrew no longer ships x86_64 bottles, so libmpv comes from MacPorts
      # and is bundled into the .app (users don't need to install mpv).
      - name: Install MacPorts, libmpv and dylibbundler
        run: |
          curl -fsSLO --retry 5 --retry-all-errors --connect-timeout 20 https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          sudo installer -pkg MacPorts-2.12.7-15-Sequoia.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N selfupdate
          sudo port -N install mpv +libmpv dylibbundler
          ls -l /opt/local/lib/libmpv*.dylib

      - name: Build and package
        run: |
          export PATH="/opt/local/bin:$PATH"
          bundle=$(bash packaging/macos/build-app.sh)
          lipo -archs "$bundle/Contents/MacOS/streamtube"
          test "$(lipo -archs "$bundle/Contents/MacOS/streamtube")" = x86_64
          fw="$bundle/Contents/Frameworks"
          mkdir -p "$fw"
          cp -L /opt/local/lib/libmpv.2.dylib "$fw/"
          chmod u+w "$fw/libmpv.2.dylib"
          install_name_tool -id @loader_path/libmpv.2.dylib "$fw/libmpv.2.dylib"
          dylibbundler -of -b -x "$fw/libmpv.2.dylib" -d "$fw" -p @loader_path/
          echo "Bundled libraries:"; ls "$fw" | wc -l; du -sh "$fw"
          if otool -L "$fw"/*.dylib | grep -q '/opt/local'; then
            echo "Unbundled /opt/local references remain:"; otool -L "$fw"/*.dylib | grep '/opt/local'; exit 1
          fi
          # dylibbundler can rewrite several LC_RPATHs to the same value; dyld rejects duplicates
          for lib in "$fw"/*.dylib; do
            chmod u+w "$lib"
            rpaths=$(otool -l "$lib" | awk '/cmd LC_RPATH/{getline; getline; print $2}')
            for rp in $(printf '%s\n' "$rpaths" | sort | uniq -d); do
              n=$(printf '%s\n' "$rpaths" | grep -cxF "$rp")
              for ((i=1; i<n; i++)); do install_name_tool -delete_rpath "$rp" "$lib"; done
            done
          done
          if ! otool -l "$fw/libmpv.2.dylib" | grep -q '/usr/lib/swift'; then
            install_name_tool -add_rpath /usr/lib/swift "$fw/libmpv.2.dylib"
          fi
          otool -l "$fw/libmpv.2.dylib" | grep -A2 LC_RPATH
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
          # Smoke test: load the bundled libmpv with MacPorts hidden
          sudo mv /opt/local /opt/local.hidden
          /usr/bin/python3 -c "import ctypes,sys; l=ctypes.CDLL(sys.argv[1]); v=l.mpv_client_api_version(); print('libmpv client API', v>>16, v&0xffff); h=l.mpv_create(); assert h; print('mpv_create OK')" "$fw/libmpv.2.dylib"
          sudo mv /opt/local.hidden /opt/local
          cargo test --release --locked --bin streamtube updater::tests::
          version=$(cargo metadata --format-version 1 --no-deps --locked | plutil -extract packages.0.version raw -o - -)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "dist/StreamTube-$version-macos-x86_64-UNOFFICIAL.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/*-macos-x86_64-UNOFFICIAL.zip
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="intel-v${VERSION}"
          cat > /tmp/release-notes.md <<EOF
          Unofficial standalone **Stream Tube ${VERSION}** build for **macOS Intel (\`x86_64\`)**.

          - **Self-contained \`.app\`:** \`libmpv\` and its runtime dependencies are bundled inside \`Contents/Frameworks\` — no Homebrew or external \`mpv\` installation needed.
          - **One-click in-app updates:** checks this repository's releases at startup and updates \`/Applications/Stream Tube.app\` directly from *Settings → About → Update*.
          - **Intel Iris Plus playback fixes:** restricts \`VideoToolbox\` hardware decode to \`h264,hevc\` to avoid the macOS VP9 \`VTDecompressionSession\` hang while keeping zero-copy \`OpenGL → IOSurface → Metal\` rendering, and dispatches \`mpv\` property changes asynchronously.
          - **Full engineering write-up:** [\`docs/MACOS_INTEL_BUILD.md\`](https://github.com/DerAndr/Stream-Tube-Desktop/blob/macos-intel/docs/MACOS_INTEL_BUILD.md)
          EOF
          sed -i '' 's/^          //' /tmp/release-notes.md
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/*-macos-x86_64-UNOFFICIAL.zip \
            --target "$TARGET_SHA" --prerelease \
            --title "Stream Tube ${VERSION} — macOS Intel (unofficial)" \
            --notes-file /tmp/release-notes.md
